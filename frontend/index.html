<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceForge ? Agent Observability</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#e8eef8;background:#101827}*{box-sizing:border-box}body{max-width:1100px;margin:40px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#9aabc2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:24px 0}.card{background:#19253a;border:1px solid #2b3b56;border-radius:12px;padding:18px}.value{font-size:27px;font-weight:700;color:#72d6bd}button{background:#72d6bd;color:#10231f;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}pre{overflow:auto;background:#0b1220;padding:16px;border-radius:10px;color:#d1def2}h1{margin-bottom:0}
</style></head><body><header><div><h1>TraceForge</h1><div class="muted">Local observability for agent workflows ? synthetic data</div></div><button id="rerun">Run demo again</button></header><section id="metrics" class="grid"></section><h2>Baseline vs candidate</h2><pre id="detail">Loading report?</pre><h2>Recent traces</h2><pre id="traces">Loading traces?</pre>
<script>
async function refresh(){const [s,t]=await Promise.all([fetch('/api/summary').then(r=>r.json()),fetch('/api/traces').then(r=>r.json())]);const m=s.report.metrics;document.querySelector('#metrics').innerHTML=[['Task success',m.task_success_rate],['Groundedness',m.groundedness_rate],['Safety',m.safety_pass_rate],['Mean latency',m.mean_latency_ms+' ms'],['Estimated cost',m.estimated_cost_usd]].map(([k,v])=>'<article class="card"><div class="muted">'+k+'</div><div class="value">'+v+'</div></article>').join('');document.querySelector('#detail').textContent=JSON.stringify({baseline:s.report.baseline,candidate:s.report.candidate,gate:s.gate},null,2);document.querySelector('#traces').textContent=JSON.stringify(t.slice(0,12),null,2)}
document.querySelector('#rerun').onclick=async()=>{await fetch('/api/demo/rerun',{method:'POST'});refresh()};refresh();
</script></body></html>
