[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.2.0"
description = "A local, deterministic AI-agent tracing and evaluation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
openai = []
anthropic = []
ollama = []
otlp = []
docs = ["reportlab>=4.2"]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
traceforge = "traceforge.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["traceforge.core", "traceforge.privacy", "traceforge.storage", "traceforge.evaluation"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
